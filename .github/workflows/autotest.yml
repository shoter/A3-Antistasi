# Runs Tools/AutoTest (launch_tests.ps1) on a Windows runner: installs the Arma 3 dedicated server with SteamCMD,
# builds @A3A and runs the SQF tests on the vanilla server (no mods).
#
# Steam refuses anonymous downloads of the Arma 3 server (app 233780, 'No subscription'), so SteamCMD logs in with
# the cached session from the STEAM_USERNAME + STEAM_CONFIG_VDF secrets, the same ones publishBranchToSteam.yml uses.
# Secrets are not given to pull requests from forks, so the job only works for branches of this repository.
# The server (~5 GB) is cached and refreshed weekly; SteamCMD only downloads what changed.
name: Automated tests

on:
  pull_request:
    branches: [unstable]
    paths:
      - 'A3A/**'
      - 'Tools/AutoTest/**'
      - 'Tools/Builder/**'
      - 'launch_tests.ps1'
      - '.github/workflows/autotest.yml'
  workflow_dispatch:

concurrency:
  group: autotest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autotest:
    name: Antistasi tests (vanilla server)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache key for the server (weekly)
        id: week
        shell: pwsh
        run: |
          $week = [Globalization.ISOWeek]::GetWeekOfYear((Get-Date).ToUniversalTime())
          "key=arma3server-win-$((Get-Date).Year)-w$week" >> $env:GITHUB_OUTPUT

      # Default ServerDir from Tools/AutoTest/autotest.settings.ps1
      - name: Restore Arma 3 server
        id: server-cache
        uses: actions/cache/restore@v4
        with:
          path: Tools/AutoTest/work/arma3server
          key: ${{ steps.week.outputs.key }}
          restore-keys: arma3server-win-

      - name: Install or update Arma 3 server (SteamCMD)
        shell: pwsh
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: ./Tools/AutoTest/install_server.ps1

      # Saved right away, so a failing test run does not mean downloading the server again next time
      - name: Save Arma 3 server
        if: steps.server-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Tools/AutoTest/work/arma3server
          key: ${{ steps.week.outputs.key }}

      - name: Configure mod build
        shell: pwsh
        run: |
          @{ OutputPath = "$env:RUNNER_TEMP\mods"; ModFolderName = '@A3A'; Sign = $false; KeyName = 'a3a' } |
              ConvertTo-Json | Set-Content Tools/Builder/buildConfig.json

      # ModsFile is empty in the committed settings, so this runs vanilla + @A3A
      - name: Run tests
        shell: pwsh
        run: |
          ./Tools/AutoTest/launch_tests.ps1 -StartupTimeoutMinutes 20
          exit $LASTEXITCODE

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-results
          path: |
            Tools/AutoTest/work/results/
            Tools/AutoTest/work/server/*.rpt
          if-no-files-found: ignore
          retention-days: 14
