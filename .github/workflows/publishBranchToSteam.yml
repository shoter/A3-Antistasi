name: Publish to Main Release on Steam

on:
  push:
    branches: [unstable]
  workflow_dispatch:

jobs:

  build:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
    - name: Checkout the code
      uses: actions/checkout@v3.3.0

    - name: Increment version locally
      run: chmod +x ./tools/incrementVersion.js &&
        node ./tools/incrementVersion.js -b ${{github.sha}}

    - name: Build addons
      run: '.\tools\Builder\buildAddons.ps1 -WorkshopID ${{secrets.WORKSHOPID}}'

    - name: Upload build addon artifact
      uses: actions/upload-artifact@v4
      with:
        name: A3A
        path: build\A3A

  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
    - name: Download addon artifact
      uses: actions/download-artifact@v4
      with:
        name: A3A
        path: A3A

    # Logs in with a cached Steam session (config.vdf) so Steam Guard does not block the runner.
    # To (re)generate STEAM_CONFIG_VDF: run `steamcmd +login <user> <pass> +quit` locally, enter the
    # Steam Guard code, then paste the contents of steamcmd's config/config.vdf into the secret.
    - name: Publish to Steam Workshop
      uses: m00nl1ght-dev/steam-workshop-deploy@v4
      with:
        username: ${{ secrets.STEAM_USERNAME }}
        configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
        appId: '107410'
        publishedFileId: ${{ secrets.WORKSHOPID }} # https://steamcommunity.com/sharedfiles/filedetails/?id=[...]
        path: 'A3A'
        changeNote: '[url=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}]Update from branch: ${{ github.ref_name }}[/url].'
